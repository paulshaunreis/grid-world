<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GridWorld</title>
<link rel="stylesheet" href="/src/grid-page-visual.css">
<script>
// Smart 404 handler — routes /citizen/* and /user/* to the profile page
(function() {
  var path = window.location.pathname;
  var citizenMatch = path.match(/^\/(citizen|user)\/([^\/]+)\/?$/);
  if (citizenMatch) {
    var username = citizenMatch[2];
    // Redirect to user.html with username parameter, preserving the clean URL in history
    window.location.replace('/user.html?handle=' + encodeURIComponent(username));
    return;
  }
  // Real 404 — show not found
  document.addEventListener('DOMContentLoaded', function() {
    document.body.innerHTML = '<div style="font-family:system-ui;text-align:center;padding:100px 20px;background:#0a0a0f;color:#fff;min-height:100vh;">' +
      '<h1 style="font-size:48px;margin-bottom:16px;">404</h1>' +
      '<p style="color:#888;margin-bottom:32px;">This page doesn\'t exist on the Grid.</p>' +
      '<a href="/" style="color:#00d4ff;text-decoration:none;border:1px solid #00d4ff;padding:12px 32px;border-radius:24px;">Back to GridWorld</a></div>';
  });
})();
</script>
</head>
<body style="margin:0;background:#0a0a0f;">
</body>
</html>
