<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email Confirmed — Grid World</title>
<meta name="description" content="Your Grid World email is confirmed. Welcome to the Grid.">
<link rel="stylesheet" href="/src/grid-page-visual.css">
<style>
  .confirm-page{min-height:100vh;display:grid;place-items:center;padding:48px 20px;
    background:radial-gradient(1200px 600px at 50% -10%,rgba(0,255,255,.06),transparent 60%),#04090f;}
  .confirm-card{width:min(520px,100%);padding:56px 48px;text-align:center;border:1px solid rgba(100,220,255,.16);
    background:rgba(5,13,23,.92);box-shadow:0 30px 90px rgba(0,0,0,.5);backdrop-filter:blur(20px);border-radius:4px}
  .confirm-kicker{font:700 10px/1 'IBM Plex Mono',monospace;letter-spacing:.22em;color:#79e9ff;margin-bottom:20px}
  .confirm-icon{font-size:64px;margin-bottom:20px}
  .confirm-card h1{font:700 clamp(30px,5vw,44px)/1.1 system-ui;margin:0 0 14px;color:#f2fbff;letter-spacing:-.02em}
  .confirm-card p{color:rgba(230,245,255,.65);font:15px/1.7 system-ui;margin:0 0 32px}
  .confirm-card p.error{color:#ff8a8a}
  .confirm-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .confirm-primary{padding:15px 32px;font:700 12px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#04121a;
    background:linear-gradient(135deg,#00e5ff,#00b8d4);border:none;border-radius:3px;cursor:pointer;text-decoration:none;
    transition:transform .12s,box-shadow .12s}
  .confirm-primary:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(0,229,255,.3)}
  .confirm-secondary{padding:15px 28px;font:700 12px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;
    color:#eaf8ff;border:1px solid rgba(100,220,255,.25);border-radius:3px;text-decoration:none}
  .confirm-spinner{width:40px;height:40px;margin:0 auto 24px;border:3px solid rgba(0,229,255,.2);
    border-top-color:#00e5ff;border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:560px){.confirm-card{padding:40px 28px}}
</style>
</head>
<body class="grid-world-page">

<main class="confirm-page">
  <div class="confirm-card" id="confirm-app">
    <div class="confirm-spinner"></div>
    <p>Confirming your email…</p>
  </div>
</main>
<script type="module">
  import { createClient } from '@supabase/supabase-js';
  import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, supabaseConfigured } from '/src/persistence/config.ts';

  const app = document.getElementById('confirm-app');

  function showError(msg) {
    app.innerHTML = `
      <div class="confirm-kicker">GRID WORLD // ARRIVAL</div>
      <div class="confirm-icon">⚠️</div>
      <h1>Confirmation didn't go through.</h1>
      <p class="error">${msg}</p>
      <div class="confirm-actions">
        <a class="confirm-primary" href="/join.html">TRY AGAIN</a>
        <a class="confirm-secondary" href="/">HOME</a>
      </div>`;
  }

  function showSuccess() {
    app.innerHTML = `
      <div class="confirm-kicker">GRID WORLD // OFFICIAL</div>
      <div class="confirm-icon">✦</div>
      <h1>Email confirmed.<br>Welcome to the Grid.</h1>
      <p id="setup-status">Setting up your profile…</p>
      <div class="confirm-actions" id="confirm-actions">
        <a class="confirm-primary" href="/enter.html">ENTER GRID WORLD →</a>
      </div>`;
    // Complete any pending profile setup from join.ts (single atomic RPC).
    // Redirect happens ONLY on setup success; on failure the user gets a
    // retry button and no auto-redirect (Phase 1 §F14).
    void completePendingProfile();
  }

  async function completePendingProfile() {
    const statusEl = document.getElementById('setup-status');
    const actionsEl = document.getElementById('confirm-actions');
    let pending = null;
    try { pending = JSON.parse(localStorage.getItem('gridworld:pending-profile') || 'null'); } catch {}
    if (!pending) {
      // Nothing pending (e.g. session existed at signup) — head straight in.
      setTimeout(() => { window.location.href = '/enter.html'; }, 1200);
      return;
    }

    const client = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const { data: { user } } = await client.auth.getUser();
    if (!user) return;

    const runSetup = async () => {
      if (statusEl) statusEl.textContent = 'Setting up your profile…';
      // Single atomic RPC (Phase 1 §F2): profiles (handle/handle_normalized,
      // display_name, beta_status='pending' insert-only) + private_profiles +
      // grid_security_questions (v2 bcrypt) in one transaction. Persists the
      // avatar style + language the old inline chain dropped.
      const { error } = await client.rpc('grid_complete_signup', {
        p_handle: pending.handle,
        p_display_name: pending.handle,
        p_first_name: pending.firstIrl || '',
        p_middle_name: '',
        p_last_name: pending.lastIrl || '',
        p_name_visibility: 'display_only',
        p_language: (navigator.language || 'en-US').split('-')[0].toLowerCase(),
        p_avatar_style: pending.avatarStyle || '',
        p_avatar_customization: null,
        p_first_name_irl: pending.firstIrl || null,
        p_last_name_irl: pending.lastIrl || null,
        p_country_code: pending.country || null,
        p_date_of_birth: pending.dob || null,
        p_q1_text: pending.sq?.[0]?.q || null,
        p_q1_answer: pending.sq?.[0]?.a || null,
        p_q2_text: pending.sq?.[1]?.q || null,
        p_q2_answer: pending.sq?.[1]?.a || null,
        p_q3_text: pending.sq?.[2]?.q || null,
        p_q3_answer: pending.sq?.[2]?.a || null,
      });
      if (error) throw error;
    };

    try {
      await runSetup();
      localStorage.removeItem('gridworld:pending-profile');
      if (statusEl) statusEl.textContent = 'Your profile is ready. Taking you to the official entry…';
      setTimeout(() => { window.location.href = '/enter.html'; }, 1500);
    } catch (e) {
      console.error('Profile setup failed:', e);
      // No auto-redirect on failure: the user keeps their pending payload
      // and gets a retry button (re-runs the RPC) + a settings escape hatch.
      if (statusEl) statusEl.textContent = 'Profile setup needs attention — your account is created, but setup did not finish. Press RETRY SETUP to finish it.';
      if (actionsEl) actionsEl.innerHTML = `
        <button class="confirm-primary" id="retry-setup" type="button">RETRY SETUP</button>
        <a class="confirm-secondary" href="/account.html">CONTINUE TO ACCOUNT SETTINGS</a>`;
      document.getElementById('retry-setup')?.addEventListener('click', async () => {
        const btn = document.getElementById('retry-setup');
        if (btn) btn.textContent = 'RETRYING…';
        try {
          await runSetup();
          localStorage.removeItem('gridworld:pending-profile');
          if (statusEl) statusEl.textContent = 'Your profile is ready. Taking you to the official entry…';
          setTimeout(() => { window.location.href = '/enter.html'; }, 1200);
        } catch (e2) {
          console.error('Profile setup retry failed:', e2);
          if (statusEl) statusEl.textContent = 'Setup still needs attention — please try again.';
          if (btn) btn.textContent = 'RETRY SETUP';
        }
      });
    }
  }

  async function handleConfirmation() {
    if (!supabaseConfigured) {
      showError('The account backend is not configured.');
      return;
    }
    const client = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // PKCE flow: ?code= — exchange it for a session (the old code only
    // handled #access_token fragments and showed "invalid or expired" for
    // perfectly good PKCE links — Phase 1 §F14).
    const code = new URLSearchParams(window.location.search).get('code');
    if (code) {
      const { error } = await client.auth.exchangeCodeForSession(code);
      if (error) {
        showError('Could not confirm your email. The link may have expired.');
        return;
      }
      showSuccess();
      return;
    }

    // Implicit flow: #access_token=...&type=signup. Wait for the client to
    // establish the session via onAuthStateChange (SIGNED_IN) instead of a
    // fixed 1500ms wait, which raced on slow networks (Phase 1 §F14).
    const hash = window.location.hash;
    if (!hash || !hash.includes('access_token')) {
      // Maybe they already confirmed and are logged in.
      const { data: { session } } = await client.auth.getSession();
      if (session) { showSuccess(); return; }
      showError('This confirmation link is invalid or has expired. Please request a new one from the join page.');
      return;
    }

    const { data: { subscription } } = client.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) {
        subscription.unsubscribe();
        showSuccess();
      }
    });

    // Fallback: if a session is already established, proceed.
    const { data: { session } } = await client.auth.getSession();
    if (session) {
      subscription.unsubscribe();
      showSuccess();
      return;
    }

    // Give the client a moment to process the fragment, then fail cleanly.
    setTimeout(async () => {
      const { data: { session: later } } = await client.auth.getSession();
      if (later) {
        subscription.unsubscribe();
        showSuccess();
      } else {
        subscription.unsubscribe();
        showError('Could not confirm your email. The link may have expired.');
      }
    }, 3000);
  }

  handleConfirmation();
</script>
<script type="module" src="/src/nav.ts"></script></body>
</html>
