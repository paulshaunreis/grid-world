<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forums — Grid World</title>
<meta name="description" content="Grid World community forums. Categories, topics and conversations — in active development.">
<link rel="stylesheet" href="/src/grid-page-visual.css">
<style>
  .forum-page{min-height:calc(100vh - 54px);padding:48px 20px 80px;
    background:radial-gradient(900px 500px at 50% 0%,rgba(0,229,255,.08),transparent 60%),#04090f;}
  .forum-shell{max-width:1180px;margin:0 auto}
  .forum-kicker{font:700 11px system-ui;letter-spacing:.22em;color:rgba(0,229,255,.75)}
  .forum-shell h1{font:700 44px/1.05 system-ui;color:#f2fbff;margin:10px 0 8px;letter-spacing:-.02em}
  .forum-shell h1 span{color:#00e5ff}
  .forum-sub{font:14px/1.6 system-ui;color:rgba(230,245,255,.6);max-width:720px;margin:0 0 6px}
  .forum-note{font:12px system-ui;color:rgba(230,245,255,.45);margin:0 0 28px}
  .forum-layout{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
  @media(max-width:820px){.forum-layout{grid-template-columns:1fr}}
  .forum-card{padding:20px;border:1px solid rgba(100,220,255,.16);border-radius:10px;
    background:linear-gradient(165deg,rgba(10,24,42,.97),rgba(5,13,23,.95));
    box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .forum-card h2{font:700 13px system-ui;letter-spacing:.16em;color:#9beaff;margin:0 0 14px}
  .gf-cat{display:block;width:100%;text-align:left;padding:11px 12px;margin-bottom:6px;cursor:pointer;
    border:1px solid rgba(255,255,255,.08);border-radius:6px;background:rgba(255,255,255,.02);color:#dff8ff}
  .gf-cat:hover{border-color:rgba(0,229,255,.4)}
  .gf-cat.active{border-color:rgba(0,229,255,.55);background:rgba(0,229,255,.08)}
  .gf-cat b{display:block;font:600 14px system-ui}
  .gf-cat small{color:#71dfff;font:700 10px system-ui;letter-spacing:.1em}
  .gf-cat span{display:block;font:11px/1.5 system-ui;color:#8198a3;margin-top:3px}
  .gf-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
  .gf-toolbar b{font:700 11px system-ui;letter-spacing:.16em;color:#71dfff}
  .gf-btn{border:1px solid rgba(0,229,255,.4);background:rgba(0,229,255,.1);color:#dff8ff;
    padding:9px 14px;border-radius:6px;cursor:pointer;font:700 12px system-ui;letter-spacing:.06em}
  .gf-btn:hover{background:rgba(0,229,255,.18)}
  .gf-btn:disabled{opacity:.5;cursor:wait}
  .gf-btn-ghost{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.03)}
  .gf-topic{display:block;width:100%;text-align:left;padding:14px;margin-bottom:8px;cursor:pointer;
    border:1px solid rgba(255,255,255,.08);border-radius:6px;background:rgba(255,255,255,.02);color:#eafaff}
  .gf-topic:hover{border-color:rgba(0,229,255,.4)}
  .gf-topic.active{border-color:rgba(0,229,255,.55);background:rgba(0,229,255,.08)}
  .gf-topic strong{display:block;font:600 15px system-ui}
  .gf-topic small{color:#718894;font:11px system-ui}
  .gf-topic span{display:block;color:#8198a3;font:12px/1.5 system-ui;margin-top:4px}
  .gf-post{padding:14px;margin-bottom:8px;border:1px solid rgba(255,255,255,.08);border-radius:6px;background:rgba(255,255,255,.02)}
  .gf-post header,.gf-post footer{display:flex;justify-content:space-between;gap:10px;color:#71dfff;font:11px system-ui}
  .gf-post header small,.gf-post footer span{color:#718894}
  .gf-post p{line-height:1.65;color:#d7e8ee;font:14px system-ui;white-space:pre-wrap;word-break:break-word}
  .gf-like{border:0;background:none;color:#8fa5af;cursor:pointer;font:12px system-ui}
  .gf-like.liked{color:#ff7eb6}
  .gf-empty{padding:28px;text-align:center;color:#718894;font:13px system-ui}
  .gf-error{padding:14px;border:1px solid rgba(255,120,120,.35);border-radius:6px;background:rgba(255,60,60,.06);color:#ffb3b3;font:13px system-ui;margin-bottom:12px}
  .gf-status{padding:10px 12px;border-radius:6px;background:rgba(0,229,255,.07);color:#bfeaff;font:12px system-ui;margin-bottom:12px}
  .gf-field{margin-bottom:12px}
  .gf-field label{display:block;font:700 11px system-ui;letter-spacing:.14em;color:rgba(230,245,255,.6);margin-bottom:6px}
  .gf-field input,.gf-field textarea{width:100%;padding:12px 14px;font:14px system-ui;color:#fff;
    background:rgba(255,255,255,.04);border:1px solid rgba(100,220,255,.25);border-radius:6px;outline:none;box-sizing:border-box}
  .gf-field textarea{min-height:90px;resize:vertical}
  .gf-back{margin-bottom:14px}
  .gf-signin-banner{padding:12px 14px;border:1px solid rgba(0,229,255,.25);border-radius:6px;background:rgba(0,229,255,.05);color:#cfeeff;font:13px system-ui;margin-bottom:14px}
  .gf-signin-banner a{color:#7ee7ff}
</style>
</head>
<body>
<main class="forum-page"><div class="forum-shell" id="forum-app"></div></main>
<script type="module" src="/src/forum.ts"></script>
<script type="module" src="/src/nav.ts"></script>
</body>
</html>
