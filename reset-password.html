<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Set a new password for your Grid World account.">
<title>Set New Password — Grid World</title>
<link rel="stylesheet" href="/src/grid-page-visual.css">
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#04090f;color:#f2fbff;font-family:system-ui,sans-serif}
  .reset-page{min-height:calc(100vh - 54px);display:grid;place-items:center;padding:32px 20px;position:relative;overflow:hidden;background:radial-gradient(900px 500px at 20% 10%,rgba(255,0,128,.08),transparent 60%),radial-gradient(1000px 600px at 80% 20%,rgba(0,229,255,.1),transparent 60%),#04090f}
  .reset-page:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:linear-gradient(rgba(0,229,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.03) 1px,transparent 1px);background-size:48px 48px}
  .reset-card{position:relative;width:min(520px,100%);box-sizing:border-box;padding:clamp(26px,6vw,44px);border:1px solid rgba(100,220,255,.2);border-radius:10px;background:linear-gradient(160deg,rgba(10,22,38,.97),rgba(5,13,23,.96));box-shadow:0 30px 90px rgba(0,0,0,.55)}
  .kicker{font:700 10px/1.4 monospace;letter-spacing:.22em;color:#00e5ff;margin-bottom:16px}
  h1{font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 12px}
  p{color:rgba(230,245,255,.68);font-size:14px;line-height:1.65}
  label{display:block;margin:18px 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(230,245,255,.78)}
  input{width:100%;box-sizing:border-box;padding:14px 15px;border-radius:6px;border:1px solid rgba(100,220,255,.24);background:rgba(255,255,255,.04);color:#f2fbff;font:15px system-ui}
  input:focus{outline:2px solid rgba(0,229,255,.65);outline-offset:2px}
  button{width:100%;margin-top:24px;padding:15px;border:0;border-radius:6px;background:linear-gradient(90deg,#00e5ff,#7df9ff);color:#001318;font-weight:800;letter-spacing:.07em;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  #reset-status{padding:12px 14px;border-radius:6px;margin-top:18px;font-size:14px;line-height:1.5}
  #reset-status:empty{display:none}
  .error{color:#ffb0bd;background:rgba(255,60,100,.09);border:1px solid rgba(255,60,100,.25)}
  .success{color:#9bffc0;background:rgba(60,255,140,.08);border:1px solid rgba(60,255,140,.25)}
  .info{color:#9befff;background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.2)}
  .links{margin-top:22px;text-align:center;font-size:13px;color:#8aa0b4}.links a{color:#79e9ff}
</style>
</head>
<body class="grid-world-page">
<main class="reset-page">
  <section class="reset-card" aria-labelledby="reset-title">
    <div class="kicker">GRID WORLD // ACCOUNT SECURITY</div>
    <h1 id="reset-title">Choose a new password.</h1>
    <p>Use the secure link from your password-reset email to open this page, then choose a new password for your account.</p>
    <form id="reset-form">
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="12" required disabled>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required disabled>
      <button id="reset-submit" type="submit" disabled>UPDATE PASSWORD</button>
    </form>
    <div id="reset-status" class="info" role="status" aria-live="polite">Checking your secure reset link…</div>
    <div class="links"><a href="/enter.html">Return to Grid World</a></div>
  </section>
</main>
<script type="module" src="/src/reset-password.ts"></script>
<script type="module" src="/src/nav.ts"></script>
</body>
</html>
